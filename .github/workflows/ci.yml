
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Validar aplicação PHP
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, json, pdo_sqlite
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar sintaxe PHP
        run: |
          find . \
            -path './.git' -prune -o \
            -path './vendor' -prune -o \
            -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l

      - name: Executar testes PHPUnit
        run: composer test

      - name: Auditar dependências
        run: composer audit

  publish:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mhsilvaworks/brasileirao-risk-monitor
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
